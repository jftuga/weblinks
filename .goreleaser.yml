version: 2

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: weblinks
    binary: weblinks
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - ppc64le
    goarm:
      - "7"
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64le

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.xz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - docs/*.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}--checksums.txt"
release:
  draft: false
  prerelease: auto
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: weblinks
    skip_upload: auto
    repository:
      owner: jftuga
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    commit_author:
      name: jftuga
      email: jftuga@users.noreply.github.com
    homepage: https://github.com/jftuga/weblinks
    description: "self-hosted personal bookmarks page"
    # The cask installs only the binary; `weblinks -install-agent` is how a
    # user opts in to starting the server at login. The agent's label goes
    # under zap, not uninstall: Homebrew runs a cask's uninstall directives on
    # every upgrade too, and uninstall launchctl also deletes the plist, which
    # would remove the user's agent each time.
    zap:
      launchctl:
        - com.jftuga.weblinks
    hooks:
      post:
        # The kickstart makes a loaded agent run the upgraded binary, which it
        # reaches through the stable $(brew --prefix)/bin symlink. It is
        # skipped when the agent is not loaded, and never fails the install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/weblinks"]
            run "/bin/sh", args: ["-c", "/bin/launchctl print gui/$(/usr/bin/id -u)/com.jftuga.weblinks >/dev/null 2>&1 && /bin/launchctl kickstart -k gui/$(/usr/bin/id -u)/com.jftuga.weblinks"], must_succeed: false
          end
